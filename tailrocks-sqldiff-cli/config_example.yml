diff:
  ignore:

    # The list of extension names to ignore.
    extensions:
      - pg_stat_statements

    # The list of enum names to ignore.
    enums:
      - subscription_status

    # The list of table names to ignore.
    tables:
      - backup_replacement
      - backup_replacement_sub_task

    # The list of sequence names to ignore.
    sequences:
      - seq_product_tag_stat_counter

    # The list of index names to ignore.
    indexes:
      - user_role_user_id_idx

    # The list of tables with columns to ignore. All related operations will be ignored, for example creating a new
    # foreign key references column from this list also will be ignored.
    columns:
      unsubscribe_reason:
        - timestamp
        - reason_types
      blogger:
        - id

    # The list of columns in some tables to ignore default value changes. Ignore only default value changes. The new
    # column will still created with default value if it set.
    columnsDefaultValue:
      unsubscribe_reason:
        - id

  migration:
    tables:
      drop:
        # Adding "IF EXISTS" condition to the "DROP TABLE" statement.
        ifExists: true
    columns:
      add:
        # Adding "IF NOT EXISTS" condition to the "ADD COLUMN" statement.
        ifNotExists: true
      drop:
        # Adding "IF EXISTS" condition to the "DROP COLUMN" statement.
        ifExists: true
    indexes:
      create:
        # Adding "IF NOT EXISTS" condition to the "CREATE INDEX" statement.
        ifNotExists: true

        # Adding "CONCURRENTLY" condition to the "CREATE INDEX" statement.
        concurrently: true
      drop:
        # Adding "IF EXISTS" condition to the "DROP INDEX" statement.
        ifExists: true

        # Adding "CONCURRENTLY" condition to the "DROP INDEX" statement.
        concurrently: true
    sequences:
      drop:
        # Adding "IF EXISTS" condition to the "DROP SEQUENCE" statement.
        ifExists: true
    safe:
      add:
        # Processed adding column with default value in two steps:
        # 1) add a new column without default value
        # 2) set default value to the new column.
        defaultColumns: false

        # Process adding column with not null condition in two or three steps:
        # 1) add a new column with nullable condition
        # 2) (optional) fill table records with null values with default value (if default value is set on the column)
        # 3) process "ALTER COLUMN ... SET NOT NULL" statement.
        notNullColumns: true

        # Generate "ALTER TABLE ... ADD CONSTRAINT ... FOREIGN KEY" query with "NOT VALID" option. It will also generate
        # create an "VALIDATE CONSTRAINT" query. Especially useful when need to add Foreign Keys with zero downtime.
        foreignKeys: true

    # Generate list of ignore records (elements) based on drop statements.
    ignoreHint: true

  # One of "NAME" or "REFERENCES" values.
  # 1) Compare foreign keys by name. That means we will compare foreign key from source schema and target schema use
  # their naming, for example `orders` table in source schema have FK linked to `users` table, and target schema
  # also have same foreign key but with different name, in this case tailrocks-sqldiff will generate migration queries
  # which contains two queries, one delete FK from source schema and one create FK based on naming from target schema.
  # This is default value.
  # 2) Compare foreign keys by references. That means we will ignore naming, if source and target schema both have
  # foreign keys with same linking and difference name, tailrocks-sqldiff will not generate any migration queries, even
  # if name of these FK links are different.
  foreignKeyCompareMethod: NAME
